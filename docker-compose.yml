# Hunting Bad Guys - one-command deployment.
#
#   cp .env.example .env     # then edit the values marked CHANGE_ME
#   docker compose up -d
#
# Services:
#   caddy  - reverse proxy, automatic HTTPS (Let's Encrypt) for SITE_ADDRESS
#   app    - FastAPI + headless Chromium + analysis tooling
#   db     - PostgreSQL (persistent results, users, cases, blog)
#
# Only Caddy publishes ports. Everything the app needs is a HUNTER_* variable
# in .env; see .env.example for the documented list.

name: huntingbadguys

services:
  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"   # HTTP/3
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-http://localhost}
      # Caddy's global `email` directive needs a value even for plain-HTTP sites.
      ACME_EMAIL: ${ACME_EMAIL:-admin@localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    networks: [edge]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  app:
    build:
      context: .
      args:
        PLAYWRIGHT_VERSION: ${PLAYWRIGHT_VERSION:-1.62.0}
    image: huntingbadguys/app:${APP_VERSION:-1.0.0}
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env}
    environment:
      HUNTER_DB_DSN: postgresql://${POSTGRES_USER:-hunter}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-hunter}
      HUNTER_DATA_DIR: /data
      HUNTER_GEOIP_DB: /data/GeoLite2-City.mmdb
      HUNTER_PRODUCTION: ${HUNTER_PRODUCTION:-true}
      HUNTER_PUBLIC_URL: ${HUNTER_PUBLIC_URL:-${SITE_ADDRESS:-http://localhost}}
    volumes:
      - app_data:/data
    depends_on:
      db:
        condition: service_healthy
    networks: [edge, internal]
    shm_size: "512mb"              # Chromium needs shared memory
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    deploy:
      resources:
        limits:
          cpus: ${APP_CPUS:-4}
          memory: ${APP_MEMORY:-8G}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "5" }

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hunter}
      POSTGRES_USER: ${POSTGRES_USER:-hunter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hunter} -d ${POSTGRES_DB:-hunter}"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }

networks:
  edge:
  internal:
    internal: true   # db is reachable from the app only, never from the internet

volumes:
  pg_data:
  app_data:
  caddy_data:
  caddy_config:
