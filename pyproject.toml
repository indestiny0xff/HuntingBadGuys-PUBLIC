[project]
name = "hunting-bad-guys"
version = "1.0.0"
description = "Self-hosted threat intelligence platform for investigating suspicious domains and IP addresses."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Hunting Bad Guys contributors" }]
keywords = ["threat-intelligence", "threat-hunting", "phishing", "dfir", "fastapi"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]

dependencies = [
    # Web framework
    "fastapi>=0.118,<1",
    "uvicorn[standard]>=0.37,<1",
    "pydantic-settings>=2.10,<3",
    "python-multipart>=0.0.20",
    # Outbound HTTP, SOCKS (Tor) and the shared headless browser.
    # The Playwright version must match the Docker base image (see Dockerfile ARG).
    "httpx[http2]>=0.28,<1",
    "socksio>=1.0",
    "playwright==1.62.0",
    "playwright-stealth>=2.0,<3",
    # Threat intelligence and analysis
    "dnspython>=2.7,<3",
    "python-whois>=0.9.5",
    "ipwhois>=1.3,<2",
    "pillow>=11",
    "geoip2>=5.1,<6",
    # Blog and changelog rendering (markdown + HTML sanitising)
    "markdown>=3.7,<4",
    "bleach>=6.2,<7",
    # Persistence
    "asyncpg>=0.30,<1",
    # Authentication (passwords, session cookies, OIDC ID tokens)
    "bcrypt>=4.2,<6",
    "pyjwt[crypto]>=2.10,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
    "ruff>=0.14",
]

[project.urls]
Homepage = "https://github.com/indestiny0xff/HuntingBadGuys-PUBLIC"
Changelog = "https://github.com/indestiny0xff/HuntingBadGuys-PUBLIC/blob/main/CHANGELOG.md"
Issues = "https://github.com/indestiny0xff/HuntingBadGuys-PUBLIC/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
package = true

# ── Ruff: linter and formatter ───────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["static", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",   # line length is handled by the formatter
    "B008",   # FastAPI uses Depends()/Query() in argument defaults
    "RUF012", # mutable class attributes are fine for pydantic models
    "SIM105", # explicit try/except/pass reads better than contextlib.suppress here
    "SIM102", # nested ifs are sometimes clearer
    "SIM108", # ternaries are not always clearer
    "RUF001", "RUF002", "RUF003",  # unicode punctuation in strings/comments
    "UP017",  # datetime.timezone.utc is explicit
    "B904",   # raise ... from exc is not always wanted in handlers
    "B905",   # zip(strict=) is noise for same-length iterables built together
    "RUF006", # fire-and-forget DB mirroring tasks are intentional
    "RUF005", "RUF015", "RUF059",
    "SIM103", "SIM117",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "F841", "B011", "B017", "SIM117"]
"scripts/*" = ["E402", "E741"]

[tool.ruff.format]
quote-style = "double"

# ── Pytest ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
log_cli = false
filterwarnings = ["ignore::DeprecationWarning"]
